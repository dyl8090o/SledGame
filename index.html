<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="styles.css">
    <title>Sled Game</title>
</head>

<body>

    <div id="mainMenuDiv">

        <h>Sled Game</h>
        <button id="playButton">Play</button>
        <button id="shopButton">Shop</button>
        <button id="skillsButton">Skills</button>

    </div>


    <div id="gameDiv">

        <p id="scoreDisplay">Score: null/</p>
        <p id="coinsDisplay">Coins: null/</p>
        <div id="heartContainer">
            <img src="Images/Heart.png" class="hearts" id="heart1">
            <img src="Images/Heart.png" class="hearts" id="heart2">
        </div>

        <div id="WASDContainer">
            <span class="WASD" id="W">W</span>
            <span class="WASD" id="S">S</span>
            <span class="WASD" id="A">A</span>
            <span class="WASD" id="D">D</span>
        </div>

        <span id="questList">Active Quests:</span>
        <canvas id="gameCanvas" width="700" height="900"></canvas>

    </div>


    <div id="gameOverDiv">

        <h>Game Over</h>
        <p id="gameOverScoreDisplay">Score: null/</p>
        <button id="gameOverMenuButton">Menu</button>

    </div>


    <div id="shopDiv">

        <h>Shop</h>
        <p id="shopCoinsDisplay">Coins: null/</p>
        <button id="shopMainMenuButton">Menu</button>
        <span id="shopBack"></span>
        <span id="shopBorder"></span>
        <!-- <button id="freeCoin">Free Coin</button> -->


        <div id="ShopButtons">

            <div class="itemDiv" id="redArrow">
                <p>Red Arrow</p>
                <img src="Images/redArrow.png">
                <button class="itemButton" id="redArrowButton">5 Coins</button>
                <span class="itemSpan"></span>
            </div>

            <div class="itemDiv" id="blueArrow">
                <p>Blue Arrow</p>
                <img src="Images/blueArrow.png">
                <button class="itemButton" id="blueArrowButton">5 Coins</button>
                <span class="itemSpan"></span>
            </div>

            <div class="itemDiv" id="greenArrow">
                <p>Green Arrow</p>
                <img src="Images/greenArrow.png">
                <button class="itemButton" id="greenArrowButton">5 Coins</button>
                <span class="itemSpan"></span>
            </div>

            <div class="itemDiv" id="orangeArrow">
                <p>Orange Arrow</p>
                <img src="Images/orangeArrow.png">
                <button class="itemButton" id="orangeArrowButton">5 Coins</button>
                <span class="itemSpan"></span>
            </div>

            <div class="itemDiv" id="purpleArrow">
                <p>Purple Arrow</p>
                <img src="Images/purpleArrow.png">
                <button class="itemButton" id="purpleArrowButton">5 Coins</button>
                <span class="itemSpan"></span>
            </div>

        </div>

    </div>

</body>

<script type="module" src="Scripts/config.js"></script>
<script type="module" src="Scripts/main.js"></script>
<script type="module" src="Scripts/ObstacleHandler.js"></script>
<script type="module" src="Scripts/PlayerHandler.js"></script>
<script type="module" src="Scripts/QuestHandler.js"></script>
<script type="module" src="Scripts/shopHandler.js"></script>
<script type="module" src="Scripts/UIHandler.js"></script>

</html>
